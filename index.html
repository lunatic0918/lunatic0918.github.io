.img-mask{

    right: 0;

.type-text{
    white-space: pre-line;

.glitch{

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSuccessSound(){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);gain.connect(audioCtx.destination);
    osc.type="square";
    osc.frequency.value=220;
    gain.gain.setValueAtTime(0.08,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.12);
    osc.start();osc.stop(audioCtx.currentTime+0.12);
}
function play404Sound(){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);gain.connect(audioCtx.destination);
    osc.type="sine";
    osc.frequency.value=90;
    gain.gain.setValueAtTime(0.09,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.35);
    osc.start();osc.stop(audioCtx.currentTime+0.35);
}
let fanNoise;
function startFanNoise(){
    if(fanNoise) return;
    const bufferSize = audioCtx.sampleRate * 2;
    const noiseBuffer = audioCtx.createBuffer(1,bufferSize,audioCtx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++) output[i] = Math.random()*2 -1;
    fanNoise = audioCtx.createBufferSource();
    fanNoise.buffer = noiseBuffer;
    fanNoise.loop=true;
    const gain = audioCtx.createGain();
    gain.gain.value=0.02;
    fanNoise.connect(gain);gain.connect(audioCtx.destination);
    fanNoise.start();
}
function stopFanNoise(){
    if(fanNoise) fanNoise.stop();fanNoise=null;
}

                link.onclick = ()=>{
                    const target = link.dataset.goto;
                    startFanNoise();
                    playSuccessSound();
                    if(!history.includes(target)) history.push(target);
                    refreshHistory();
                    renderPage(target);
                }
            })
            return;
        }
        wrap.innerText += text[idx];
        idx++;
    },28);
}

function renderPage(key){
    const page = pageData[key];
    if(!page) return;
    let imgHtml = "";
    if(imgSrcMap[page.imgName]){
        imgHtml = `<div class="page-img">
            <img src="${imgSrcMap[page.imgName]}" style="width:100%;display:block;">
            <div class="img-mask"></div>
        </div>`;
    }
    let finalHtml = `<h3>${page.title}</h3>${imgHtml}${page.content}`;
    if(isGoodEnd && key === "home"){
        finalHtml += `<div class="flower-mark">🌿</div>`;
    }
    typeWrite(finalHtml,()=>{
        if(!page.isEnd){
            setTimeout(()=>{
                contentDom.classList.add("glitch");
                setTimeout(()=>contentDom.classList.remove("glitch"),300);
            },Math.random()*6000+2000);
        }
        if(page.isEnd && page.endType==="good"){
            localStorage.setItem("forgetIndex_goodend","1");
            isGoodEnd=true;
            stopFanNoise();
        }else if(page.isEnd && page.endType==="bad"){
            stopFanNoise();
        }
    });
}

function refreshHistory(){
    historyDom.innerText = history.join(" → ");
}

function doSearch(){
    const raw = inputDom.value.trim();
    inputDom.value = "";
    if(!raw) return;
    startFanNoise();
    const targetKey = normalizeKey(raw);
    if(!pageData[targetKey]){
        play404Sound();
        renderPage("404");
        return;
    }
    playSuccessSound();
    if(!history.includes(targetKey)) history.push(targetKey);
    refreshHistory();
    renderPage(targetKey);
}

function resetGame(){
    history = [];
    refreshHistory();
    localStorage.removeItem("forgetIndex_goodend");
    isGoodEnd = false;
    stopFanNoise();
    renderPage("home");
}

document.getElementById("search-btn").onclick = doSearch;
document.getElementById("reset-btn").onclick = resetGame;
inputDom.onkeydown = (e)=>{if(e.key==="Enter") doSearch();};

renderPage("home");
refreshHistory();
</script>
</body>
</html>
